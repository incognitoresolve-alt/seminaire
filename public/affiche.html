<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CheckSanté – Affiche QR</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="modulepreload" href="/dist/affiche.js">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="bg-white">
  <main class="mx-auto flex min-h-dvh max-w-xl flex-col items-center justify-center px-6 text-center">
    <p class="mb-4 flex flex-wrap justify-center text-4xl font-black sm:text-5xl"><span class="inline-flex items-center gap-2"><img src="/logo.svg" alt="" class="size-16" width="64" height="64"><span>Check<span class="text-sky-700">Santé</span></span></span></p>
    <p class="text-lg font-bold tracking-widest text-sky-800 uppercase">ICC Liège · Semaine de la santé</p>
    <h1 id="title" class="mt-2 text-3xl font-black break-words sm:text-5xl">Scannez pour vous inscrire</h1>
    <div id="qr" class="my-8 w-full max-w-sm"></div>
    <p id="url" class="font-mono text-xl font-bold break-all"></p>
    <div data-partner-credit class="mt-10"></div>
    <button id="print" class="btn-primary mt-8 print:hidden" type="button">Imprimer</button>
  </main>
  <script type="module" src="/dist/affiche.js"></script>
</body>
</html>
