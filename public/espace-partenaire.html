<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Espace partenaire – CheckSanté</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="modulepreload" href="/dist/espace-partenaire.js">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="min-h-dvh">
  <main id="gate" hidden class="mx-auto flex min-h-dvh max-w-sm flex-col justify-center px-4">
    <img src="/logo.svg" alt="" class="mx-auto mb-3 size-12" width="48" height="48">
    <h1 class="text-center text-2xl font-extrabold">Espace partenaire</h1>
    <p class="mt-1 mb-6 text-center text-sm text-slate-600">Vos demandes de contact « check-up couverture »</p>
    <form id="gate-form" class="space-y-3">
      <label class="sr-only" for="key">Clé partenaire</label>
      <input id="key" class="field text-center font-mono" type="password" autocomplete="current-password" required maxlength="128" placeholder="Clé partenaire" autofocus>
      <p id="gate-err" class="err text-center" role="alert"></p>
      <button class="btn-primary w-full" type="submit">Entrer</button>
    </form>
  </main>

  <div id="app" hidden>
    <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 backdrop-blur">
      <div class="mx-auto flex max-w-4xl flex-wrap items-center gap-2 px-4 py-2">
        <h1 class="mr-auto flex items-center gap-2 text-lg font-extrabold"><img src="/logo.svg" alt="" class="size-8" width="32" height="32">Mes contacts</h1>
        <a href="/api/partner/leads.csv" class="btn-primary min-h-11 px-3 text-sm" download>Télécharger (Excel / CSV)</a>
        <button id="logout" type="button" class="btn-ghost min-h-11 px-3 text-sm">Se déconnecter</button>
      </div>
      <div class="mx-auto max-w-4xl px-4 pb-3">
        <input id="q" type="search" class="field py-2.5" placeholder="Rechercher un nom, un e-mail, un téléphone…" autocomplete="off">
        <div id="f-status" class="mt-2 flex gap-2 overflow-x-auto pb-1" role="group" aria-label="Filtrer par statut"></div>
      </div>
    </header>
    <main class="mx-auto max-w-4xl px-4 py-3">
      <ul id="list" class="space-y-2"></ul>
      <p id="empty" class="py-12 text-center text-slate-500"></p>
      <p class="pb-8 text-center text-xs text-slate-500">Contacts ayant donné leur accord. « STOP » = effacement définitif. Sans suite, les contacts sont effacés automatiquement après 180 jours : exportez vos clients vers votre propre outil.</p>
    </main>
  </div>
  <div id="toast" class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex justify-center px-4" aria-live="assertive"></div>
  <script type="module" src="/dist/espace-partenaire.js"></script>
</body>
</html>
