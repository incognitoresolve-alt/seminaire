<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f172a">
  <title>Pôle soins – Séminaire</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="modulepreload" href="/js/staff.js">
  <link rel="modulepreload" href="/js/store.js">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="min-h-dvh">
  <!-- Verrou PIN d'événement -->
  <main id="gate" hidden class="mx-auto flex min-h-dvh max-w-sm flex-col justify-center px-4">
    <h1 class="text-center text-3xl font-extrabold">Pôle soins</h1>
    <p class="mt-2 mb-6 text-center text-slate-600">Code d’accès de l’événement</p>
    <form id="gate-form" class="space-y-3">
      <label class="sr-only" for="pin">Code PIN</label>
      <input id="pin" name="pin" class="field text-center font-mono text-3xl tracking-[.4em]" type="password" inputmode="numeric" autocomplete="current-password" required maxlength="32" autofocus>
      <p id="gate-err" class="err text-center" role="alert"></p>
      <button class="btn-primary w-full text-lg" type="submit">Entrer</button>
    </form>
  </main>

  <div id="app" hidden>
    <header class="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur">
      <div class="mx-auto flex max-w-5xl items-center gap-2 px-4 py-2">
        <h1 class="mr-auto text-lg font-extrabold">Pôle soins</h1>
        <span id="status" class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-3 py-1 text-xs font-bold" role="status" aria-live="polite"></span>
        <button id="open-stats" class="btn-ghost min-h-11 px-3" type="button" aria-label="Statistiques du questionnaire">
          <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span class="hidden lg:inline">Questionnaire</span>
        </button>
        <button id="open-scan" class="btn-ghost min-h-11 px-3" type="button" aria-label="Scanner un Pass">
          <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>
          <span class="hidden sm:inline">Scanner</span>
        </button>
        <button id="open-add" class="btn-primary min-h-11 px-3" type="button">
          <svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span><span class="hidden sm:inline">Ajouter manuellement</span><span class="sm:hidden">Ajouter</span></span>
        </button>
      </div>
      <div class="mx-auto max-w-5xl px-4 pb-3">
        <label for="q" class="sr-only">Rechercher un patient</label>
        <input id="q" type="search" class="field py-2.5" placeholder="Nom, prénom ou code…" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <div class="mt-2 flex gap-2 overflow-x-auto pb-1" role="group" aria-label="Filtrer par triage" id="f-triage"></div>
        <div class="mt-1 flex gap-2 overflow-x-auto pb-1" role="group" aria-label="Filtrer par médecin" id="f-doctor"></div>
      </div>
    </header>

    <main class="mx-auto max-w-5xl px-4 py-3">
      <ul id="list" class="space-y-2" aria-live="off"></ul>
      <div id="list-state" class="py-12 text-center text-slate-500"></div>
    </main>
  </div>

  <!-- Fiche patient -->
  <dialog id="sheet" class="m-0 h-dvh max-h-none w-full max-w-none bg-slate-50 p-0 sm:m-auto sm:h-auto sm:max-h-[92dvh] sm:max-w-2xl sm:rounded-3xl" aria-labelledby="sheet-name">
    <div id="sheet-body"></div>
  </dialog>

  <!-- Ajout manuel -->
  <dialog id="add" class="m-0 h-dvh max-h-none w-full max-w-none bg-slate-50 p-0 sm:m-auto sm:h-auto sm:max-h-[92dvh] sm:max-w-lg sm:rounded-3xl" aria-labelledby="add-title">
    <div class="flex items-center justify-between border-b border-slate-200 bg-white px-4 py-3">
      <h2 id="add-title" class="text-lg font-extrabold">Ajouter un participant</h2>
      <button class="btn-ghost min-h-11 px-3" type="button" data-close aria-label="Fermer">✕</button>
    </div>
    <form id="add-form" novalidate class="relative space-y-1 p-4">
      <div id="add-fields"></div>
      <p data-form-error class="err text-center" role="alert"></p>
      <button type="submit" class="btn-primary w-full text-lg">Créer le Pass Patient</button>
    </form>
    <section id="add-done" hidden class="space-y-3 p-4">
      <div id="add-pass"></div>
      <div class="grid grid-cols-2 gap-3">
        <button type="button" id="add-again" class="btn-ghost">Nouvelle inscription</button>
        <button type="button" id="add-open" class="btn-primary">Ouvrir la fiche</button>
      </div>
    </section>
  </dialog>

  <!-- Scanner -->
  <dialog id="scan" class="m-0 h-dvh max-h-none w-full max-w-none bg-black p-0 text-white sm:m-auto sm:h-auto sm:max-w-lg sm:rounded-3xl" aria-label="Scanner un Pass">
    <div class="relative">
      <video id="scan-video" class="aspect-[3/4] w-full object-cover sm:aspect-square" muted playsinline></video>
      <div class="pointer-events-none absolute inset-0 flex items-center justify-center" aria-hidden="true">
        <div class="size-60 rounded-3xl border-4 border-white/90 shadow-[0_0_0_9999px_rgb(0_0_0/0.35)]"></div>
      </div>
      <button class="btn absolute top-3 right-3 bg-black/60 text-white" type="button" data-close aria-label="Fermer">✕</button>
    </div>
    <form id="scan-form" class="flex gap-2 p-4">
      <label for="scan-code" class="sr-only">Code de secours</label>
      <input id="scan-code" class="field flex-1 font-mono uppercase text-slate-900" placeholder="Code (ex : K7P2QX)" maxlength="32" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button class="btn-primary" type="submit">Ouvrir</button>
    </form>
    <p id="scan-msg" class="px-4 pb-4 text-center text-sm text-slate-200" role="status"></p>
  </dialog>

  <!-- Statistiques questionnaire -->
  <dialog id="stats" class="m-0 h-dvh max-h-none w-full max-w-none bg-slate-50 p-0 sm:m-auto sm:h-auto sm:max-h-[92dvh] sm:max-w-2xl sm:rounded-3xl" aria-labelledby="stats-title">
    <div class="sticky top-0 flex items-center justify-between border-b border-slate-200 bg-white px-4 py-3">
      <h2 id="stats-title" class="text-lg font-extrabold">Questionnaire de prévention · résultats en direct</h2>
      <button class="btn-ghost min-h-11 px-3" type="button" data-close aria-label="Fermer">✕</button>
    </div>
    <div id="stats-body" class="space-y-6 p-4"></div>
  </dialog>

  <div id="toast" class="pointer-events-none fixed inset-x-0 bottom-4 z-50 flex justify-center px-4" aria-live="assertive"></div>
  <script type="module" src="/js/staff.js"></script>
</body>
</html>
