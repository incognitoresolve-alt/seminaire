<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CheckSanté – Séminaire spécial ICC Liège · Consultation de prévention</title>
  <meta name="description" content="Inscription rapide à la consultation de prévention gratuite du Séminaire spécial ICC Liège.">
  <meta name="theme-color" content="#5b1f8c">
  <meta property="og:title" content="CheckSanté – Consultation de prévention">
  <meta property="og:site_name" content="CheckSanté">
  <meta property="og:image" content="/logo.svg">
  <meta property="og:description" content="Consultation de prévention gratuite avec des professionnels de la santé.">
  <meta property="og:type" content="website">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="modulepreload" href="/dist/register.js">
  <link rel="stylesheet" href="/app.css">
</head>
<body class="min-h-dvh">
  <main class="mx-auto max-w-lg px-4 pt-6 pb-16">
    <nav class="mb-3 flex justify-end" aria-label="Accès soignants">
      <a href="/staff" class="inline-flex min-h-11 items-center gap-2 rounded-full bg-accent-dark px-4 text-sm font-bold text-white shadow-md hover:bg-accent">
        <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        Liste des inscrits
      </a>
    </nav>
    <header class="relative mb-6 overflow-hidden rounded-3xl bg-sky-800 px-5 pt-5 pb-6 text-center text-white shadow-lg">
      <div class="absolute -top-20 -right-20 size-36 rotate-12 rounded-[2.5rem] bg-accent opacity-90" aria-hidden="true"></div>
      <div class="relative">
        <p class="flex justify-center text-2xl font-black"><span class="inline-flex items-center gap-2"><img src="/logo.svg" alt="" class="size-9 rounded-xl ring-2 ring-white/70" width="36" height="36"><span>Check<span class="text-orange-300">Santé</span></span></span></p>
        <p class="mt-3 text-xs font-semibold tracking-[.2em] text-sky-100 uppercase">Impact Centre Chrétien Liège</p>
        <h1 class="mt-1 text-4xl leading-none font-black tracking-tight uppercase">Séminaire spécial</h1>
        <p class="mt-2 inline-block rounded-md bg-accent-dark px-3 py-1 text-sm font-bold">famille – santé – guérison divine</p>
        <p class="mt-3 text-base font-bold">Mer. 11 → Sam. 14 novembre · Herstal</p>
        <p class="mt-2 text-sm text-sky-100">Consultation de prévention gratuite avec des professionnels de la santé.</p>
      </div>
    </header>

    <div id="done" hidden class="mb-3" role="status" aria-live="polite"></div>
    <form id="reg" novalidate class="glass relative space-y-1 rounded-3xl p-5">
      <div id="reg-fields"></div>
      <p data-form-error class="err text-center" role="alert"></p>
      <button type="submit" class="btn-primary sticky bottom-[max(.75rem,env(safe-area-inset-bottom))] z-10 w-full text-lg shadow-lg shadow-sky-900/20">Enregistrer l’inscription</button>
    </form>


    <a href="/staff" class="btn glass mt-8 w-full text-sm text-slate-800">
      <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Liste des inscrits (soignants)
    </a>
    <div data-partner="public" class="mt-8"></div>
    <footer class="mt-6 text-center text-sm text-slate-500">
      <a class="underline" href="/confidentialite">Confidentialité</a> · <a class="underline" href="/cgu">CGU</a>
      <div data-partner-credit class="mt-4 text-center"></div>
    </footer>
  </main>
  <script type="module" src="/dist/register.js"></script>
</body>
</html>
