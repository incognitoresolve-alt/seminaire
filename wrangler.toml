name = "seminaire-triage"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
# routes = [{ pattern = "triage.example.fr", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "seminaire"
database_id = "522fae40-c762-4522-8f46-2106ece3f07f"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

# Rate limiting natif (par IP). Attention : un Wi-Fi de séminaire = beaucoup de clients derrière une IP.
[[ratelimits]]
name = "RL_REGISTER"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "RL_LOGIN"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_LOGIN_GLOBAL"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_API"
namespace_id = "1003"
simple = { limit = 1200, period = 60 }

[vars]
RETENTION_DAYS = "30"
LEADS_RETENTION_DAYS = "180"
TRASH_DAYS = "30"
FEEDBACK_RETENTION_DAYS = "180"

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
